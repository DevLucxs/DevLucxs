<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#241b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0a16" stop-opacity="1"/>
    </radialGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#glow)"/>

  <!-- background data/tech motifs, low opacity -->
  <g opacity="0.10" fill="none" stroke="#a29bfe" stroke-width="1.2" font-family="'Courier New', monospace">

    <!-- database cylinder, left -->
    <g transform="translate(75,60)">
      <ellipse cx="0" cy="0" rx="26" ry="9"/>
      <path d="M -26 0 L -26 55 A 26 9 0 0 0 26 55 L 26 0"/>
      <ellipse cx="0" cy="20" rx="26" ry="9"/>
      <ellipse cx="0" cy="38" rx="26" ry="9"/>
    </g>

    <!-- second, smaller database cylinder, top right area -->
    <g transform="translate(700,35) scale(0.55)">
      <ellipse cx="0" cy="0" rx="26" ry="9"/>
      <path d="M -26 0 L -26 55 A 26 9 0 0 0 26 55 L 26 0"/>
      <ellipse cx="0" cy="20" rx="26" ry="9"/>
      <ellipse cx="0" cy="38" rx="26" ry="9"/>
    </g>

    <!-- cloud shape, upper middle-right -->
    <path d="M 610 45 a 10 10 0 0 1 19 -4 a 8 8 0 0 1 15 6 a 9 9 0 0 1 -2 18 h -30 a 9 9 0 0 1 -2 -20 z"/>

    <!-- network nodes, right -->
    <g stroke="#a29bfe">
      <circle cx="790" cy="55" r="5" fill="#a29bfe" stroke="none"/>
      <circle cx="835" cy="80" r="5" fill="#a29bfe" stroke="none"/>
      <circle cx="800" cy="115" r="5" fill="#a29bfe" stroke="none"/>
      <circle cx="850" cy="140" r="5" fill="#a29bfe" stroke="none"/>
      <line x1="790" y1="55" x2="835" y2="80"/>
      <line x1="835" y1="80" x2="800" y2="115"/>
      <line x1="800" y1="115" x2="850" y2="140"/>
      <line x1="790" y1="55" x2="800" y2="115"/>
    </g>

    <!-- small node cluster, upper left -->
    <g stroke="#a29bfe">
      <circle cx="180" cy="30" r="4" fill="#a29bfe" stroke="none"/>
      <circle cx="215" cy="50" r="4" fill="#a29bfe" stroke="none"/>
      <circle cx="165" cy="55" r="4" fill="#a29bfe" stroke="none"/>
      <line x1="180" y1="30" x2="215" y2="50"/>
      <line x1="180" y1="30" x2="165" y2="55"/>
      <line x1="165" y1="55" x2="215" y2="50"/>
    </g>

    <!-- bar chart, bottom left -->
    <g fill="#a29bfe" stroke="none">
      <rect x="55" y="165" width="10" height="20"/>
      <rect x="70" y="150" width="10" height="35"/>
      <rect x="85" y="160" width="10" height="25"/>
      <rect x="100" y="140" width="10" height="45"/>
    </g>

    <!-- pie chart, bottom right -->
    <g transform="translate(720,165)">
      <circle cx="0" cy="0" r="16" fill="none"/>
      <path d="M 0 0 L 0 -16 A 16 16 0 0 1 14 8 Z" fill="#a29bfe" stroke="none"/>
      <path d="M 0 0 L 14 8 A 16 16 0 0 1 -14 8 Z" fill="none"/>
      <path d="M 0 0 L -14 8 A 16 16 0 0 1 0 -16 Z" fill="none"/>
    </g>

    <!-- binary strings -->
    <text x="740" y="30" font-size="13">01001</text>
    <text x="60" y="115" font-size="13">10110</text>
    <text x="760" y="200" font-size="13">0101</text>
    <text x="30" y="200" font-size="12">11010</text>
    <text x="600" y="200" font-size="12">00110</text>

    <!-- sql snippet -->
    <text x="150" y="200" font-size="13">SELECT * FROM</text>

    <!-- code brackets -->
    <text x="120" y="35" font-size="22">&lt;/&gt;</text>
    <text x="640" y="115" font-size="20">{ }</text>
  </g>

  <!-- thin top and bottom accent rules -->
  <line x1="60" y1="34" x2="260" y2="34" stroke="#6c5ce7" stroke-width="2"/>
  <line x1="640" y1="34" x2="840" y2="34" stroke="#6c5ce7" stroke-width="2"/>
  <line x1="60" y1="186" x2="260" y2="186" stroke="#6c5ce7" stroke-width="2"/>
  <line x1="640" y1="186" x2="840" y2="186" stroke="#6c5ce7" stroke-width="2"/>

  <!-- small square markers -->
  <rect x="56" y="30" width="8" height="8" fill="#a29bfe"/>
  <rect x="836" y="30" width="8" height="8" fill="#a29bfe"/>
  <rect x="56" y="182" width="8" height="8" fill="#a29bfe"/>
  <rect x="836" y="182" width="8" height="8" fill="#a29bfe"/>

  <!-- name: bold sans-serif, wide letter-spacing, uppercase, new color -->
  <text x="450" y="110" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="42" fill="#f2f0fa" filter="url(#textGlow)" letter-spacing="10">
    LUCAS LIMA
  </text>

  <!-- divider line -->
  <line x1="420" y1="132" x2="480" y2="132" stroke="#6c5ce7" stroke-width="1.5" opacity="0.7"/>

  <!-- tagline -->
  <text x="450" y="160" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#dcd8ff" letter-spacing="1.5">
    Engenharia de Dados · Python · SQL · Cloud
  </text>

  <!-- info line: only github -->
  <text x="450" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#8f7ee8" letter-spacing="1.5">
    github.com/devlucxs
  </text>
</svg>
